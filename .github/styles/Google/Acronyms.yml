extends: conditional
message: "Spell out '%s', if it's unfamiliar to the audience."
link: 'https://developers.google.com/style/abbreviations'
level: suggestion
ignorecase: false
# Ensures that the existence of 'first' implies the existence of 'second'.
first: '\b([A-Z]{3,5})\b'
second: '(?:\b[A-Z][a-z]+ )+\(([A-Z]{3,5})\)'
# ... with the exception of these:
exceptions:
  - API
  - ASP
  - CEST
  - CET
  - CLI
  - CNAME
  - CPU
  - CSS
  - CSV
  - DEBUG
  - DEV
  - DNS
  - DOM
  - EAR
  - FAQ
  - FTP
  - GET
  - GNU
  - GPU
  - GUI
  - HEAD
  - HTML
  - HTTP
  - HTTPS
  - IDE
  - ISO
  - JAR
  - JSON
  - JSX
  - JVM
  - JWT
  - LDN
  - LESS
  - MTL
  - NET
  - NGINX
  - NOTE
  - PAR
  - PATCH
  - PATH
  - PDF
  - PHP
  - POST
  - PUT
  - RAM
  - RBX
