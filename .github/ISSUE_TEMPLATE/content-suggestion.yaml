name: 📝 Content and guide suggestion
description: Suggest new documentation content or a deployment guide
title: "Content: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest new content for the Clever Cloud documentation.
        Your feedback helps improve and expand it.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: "Prerequisites check"
      description: "Have you checked if this content already exists?"
      options:
        - label: Searched the existing [documentation](https://www.clever.cloud/developers/) for related content
          required: true
        - label: Searched the existing [issues](https://github.com/CleverCloud/documentation/issues) for related requests
          required: true

  - type: dropdown
    id: content-type
    attributes:
      label: "Type of content requested"
      description: "What type of content would you like to see?"
      options:
        - API
        - Documentation
        - Guide or tutorial
        - Other
    validations:
      required: true

  - type: textarea
    id: content-description
    attributes:
      label: "Content description"
      description: "Describe clearly what content should be added"
      placeholder: "Documentation about... would help users to..."
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: "Use case and target audience"
      description: "Who would benefit from this content and why?"
      placeholder: "This would help developers who are trying to... / New users need this when..."

  - type: textarea
    id: framework-details
    attributes:
      label: "Technical details (for framework guides)"
      description: "For a framework guide, provide its name, version and any deployment-specific requirements"
      placeholder: "Framework: Laravel 10, challenges: queue configuration with Redis, special dependencies..."

  - type: textarea
    id: additional-context
    attributes:
      label: "Additional context (optional)"
      description: "Helpful resources, official documentation, existing examples, etc."
      placeholder: "Official docs: https://... Example projects: https://..."
