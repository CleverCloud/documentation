baseURL: https://www.clever.cloud/developers
title: Clever Cloud Documentation
publishDir: public/developers

module:
  imports:
  - path: github.com/imfing/hextra
  hugoVersion:
    extended: true
    min: 0.154.5

disableKinds:
  - taxonomy
  - term

enableEmoji: true
enableGitInfo: true
enableInlineShortcodes: true
hasCJKLanguage: true

locale: en-US

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
        enable: true

menu:
  main:
    - identifier: documentation
      name: Documentation
      pageRef: /doc/
      weight: 1
    - identifier: tutorials
      name: Guides
      pageRef: /guides/
      weight: 2
    - identifier: api
      name: API
      weight: 3
    - name: "How to use"
      parent: api
      url: "/api/"
    - name: "v2 endpoints"
      parent: api
      url: "/api/v2"
    - name: "v4 endpoints"
      parent: api
      url: "/api/v4"
    - identifier: cli
      name: CLI
      pageRef: /doc/manage/cli/
      weight: 4
    - identifier: changelog
      name: Changelog
      pageRef: /changelog/
      weight: 5
    - identifier: components
      name: Web Components
      url: https://www.clever.cloud/developers/clever-components/
      weight: 6
    - name: Search
      weight: 7
      params:
        type: search
    - name: GitHub
      weight: 8
      url: https://github.com/CleverCloud/documentation/
      params:
        icon: github
    - name: Website
      weight: 9
      url: https://www.clever.cloud/
      params:
        icon: globe-alt

  sidebar:
    - name: More
      params:
        type: separator
      weight: 1
    - name: Contribute
      pageRef: /doc/contribute/
      weight: 2
    - name: Clever Tools (CLI)
      pageRef: /doc/cli-reference/
      weight: 3
    - name: Environment variables
      pageRef: /doc/develop/common-configuration/environment-variables/reference/
      weight: 4
    - name: Postmortems
      pageRef: /postmortem/
      weight: 5

outputs:
  home: [HTML, LLMS]
  page: [HTML, Markdown]
  section: [HTML, Markdown, RSS]

outputFormats:
  LLMS:
    mediaType: text/plain
    baseName: llms
    isPlainText: true

  Markdown:
    baseName: index.html

pagination:
  pagerSize: 21 # Number of entries in Changelog section before pagination

params:
  blog:
    list:
      displayTags: true
      # date | lastmod | publishDate | title | weight
      sortBy: date
      sortOrder: desc # or "asc"
      pagerSize: 20

    article:
      displayPagination: true

  description: Clever Cloud is a Platform-as-a-Service (PaaS) cloud provider, an automated hosting platform for developers. Deploy your app easily and launch dependencies without having to worry about the infrastructure set up.

  displayUpdatedDate: true
  dateFormat: January 2, 2006

  editURL:
    enable: true
    base: https://github.com/CleverCloud/documentation/edit/main/content/

  externalLinkDecoration: true

  footer:
    enable: false
    displayCopyright: false
    displayPoweredBy: false
    width: normal

  highlight:
    copy:
      enable: true
      # hover | always
      display: hover

  images:
  - images/feature.png

  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: images/logo.svg
      dark: images/logo-dark.svg
      link: /developers
      width: 175
    width: full

  page:
    # full (100%), wide (90rem), normal (1280px)
    width: full
    tabs:
      sync: true
    contextMenu:
      enable: true
      links:
        - name: Open in ChatGPT
          icon: chatgpt
          url: "https://chatgpt.com/?hints=search&q=Read+this+Clever+Cloud+documentation+page+and+help+me+understand+and+apply+it+to+my+project%3A+{url}%0ARaw+Markdown+source%3A+{markdown_url}"
        - name: Open in Claude
          icon: claude
          url: "https://claude.ai/new?q=Read+this+Clever+Cloud+documentation+page+and+help+me+understand+and+apply+it+to+my+project%3A+{url}%0ARaw+Markdown+source%3A+{markdown_url}"
        - name: Open in Le Chat
          icon: mistral
          url: "https://chat.mistral.ai/chat?q=Read+this+Clever+Cloud+documentation+page+and+help+me+understand+and+apply+it+to+my+project%3A+{url}%0ARaw+Markdown+source%3A+{markdown_url}"
        - name: Open in Perplexity
          icon: perplexity
          url: "https://www.perplexity.ai/search?q=Read+this+Clever+Cloud+documentation+page+and+help+me+understand+and+apply+it+to+my+project%3A+{url}%0ARaw+Markdown+source%3A+{markdown_url}"

  imageZoom:
    enable: true

  search:
    enable: true
    type: flexsearch

    flexsearch:
      # index page by: content | summary | heading | title
      index: content
      # full | forward | reverse | strict
      tokenize: forward

  theme:
    # light | dark | system
    default: system
    displayToggle: true

privacy:
  youtube:
    privacyEnhanced: true
