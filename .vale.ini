StylesPath = .github/styles

Vocab = Doc

MinAlertLevel = suggestion

Packages = Hugo

[*.md]
BasedOnStyles = Clever, Vale
Vale.Terms = NO

# Changelogs and postmortems can announce what's coming
[content/{changelog,postmortem}/**/*.md]
Clever.present-tense = NO

# Changelog entries can announce commitments and speak for Clever Cloud with 'we'
[content/changelog/**/*.md]
Clever.first-person-plural = NO
Clever.timeless = NO

# Archetypes are Hugo templates: their Go expressions aren't prose. TokenIgnores
# doesn't reach the front matter title, hence sentence-spacing is off there
[archetypes/*.md]
TokenIgnores = ({{ [^}]+ }})
Clever.sentence-spacing = NO

# The external documentation issue template holds create-an-issue expressions, such as {{ env.PR_URL }}
[.github/external-doc-issue.md]
TokenIgnores = ({{ [^}]+ }})
Clever.sentence-spacing = NO

# The home page feature grid is one multi-line shortcode, which Vale reads as a paragraph
[content/_index.md]
Clever.paragraph-length = NO

[*.xml]
Transform = docbook-xsl-snapshot/html/docbook.xsl
