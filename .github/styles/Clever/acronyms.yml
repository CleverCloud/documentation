extends: conditional
message: "Spell out '%s' at its first use on the page, followed by the acronym in parentheses"
level: suggestion
ignorecase: false
# Each acronym matched by 'first' must be defined on the page by 'second': words
# followed by the acronym in parentheses, such as 'multi-factor authentication (MFA)'
first: '\b([A-Z]{3,5})\b'
second: '(?:\b[\w-]+ )+\(([A-Z]{3,5})\)'
# Acronyms most readers already know, short callout markers, HTTP methods, time zones,
# Clever Cloud region codes, and plan names
exceptions:
  - ANSI
  - API
  - ASP
  - CDN
  - CEST
  - CET
  - CLI
  - CNAME
  - CORS
