name: ❓ Other request
description: For requests that don't fit into other categories
title: "Other: "
body:
  - type: markdown
    attributes:
      value: |
        Use this template for requests that don't fit into the other categories.

        **Before using this template**, check whether your request fits better in:
        - 📝 Content and guide suggestion (new content, framework guides)
        - ⚠️ Report a problem (errors, bugs, UX issues, clarifications)

  - type: checkboxes
    id: other-prerequisites
    attributes:
      label: "Prerequisites check"
      description: "Have you checked the appropriate resources?"
      options:
        - label: This request doesn't fit into the other issue templates
          required: true
        - label: Searched the existing [issues](https://github.com/CleverCloud/documentation/issues) for related requests
          required: true

  - type: textarea
    id: issue-description
    attributes:
      label: "Describe your request"
      description: "Describe what you need"
      placeholder: "A request for... / A missing... / A problem noticed in..."
    validations:
      required: true

  - type: textarea
    id: context-details
    attributes:
      label: "Additional context"
      description: "Any additional information that helps understand your request"
      placeholder: "Related pages, external links, specific examples, etc."
