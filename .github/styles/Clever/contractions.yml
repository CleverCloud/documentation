extends: substitution
message: "Use '%s' instead of '%s'"
level: suggestion
ignorecase: true
# 'that is' stays out: latin-abbreviations.yml recommends it instead of 'i.e.'
action:
  name: replace
swap:
  are not: aren't
  cannot: can't
  could not: couldn't
  did not: didn't
  do not: don't
  does not: doesn't
  has not: hasn't
  have not: haven't
  is not: isn't
  it is: it's
  should not: shouldn't
  they are: they're
  was not: wasn't
  were not: weren't
  will not: won't
