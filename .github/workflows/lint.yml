name: Lint

on:
  pull_request:
    branches: [ main ]

jobs:
  markdownlint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: '**/*.md'

  commitlint:
    name: Check commit messages
    needs: markdownlint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # The subjects live in the commit objects, so the whole history is fetched
      # but only the blobs of the checked-out tree are downloaded.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Install commitlint
        uses: jdx/mise-action@v5
        with:
          install_args: node npm:@commitlint/cli

      - name: Check the commit messages
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: commitlint --from "$PR_BASE" --to "$PR_HEAD" --verbose
